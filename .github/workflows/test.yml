name: Run Unit Tests

on:
  push:
    branches:
      - '**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    env:
      EPMT_GUI_MOCK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements-ui.txt.py3'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ui.txt.py3

      - name: Run test_boxplot (GUARDED)
        continue-on-error: true
        run: |
          python -m unittest --verbose ./test/test_boxplot.py

      - name: Run test_bsly001 (GUARDED)
        continue-on-error: true
        run: |
          python -m unittest --verbose ./test/test_bsly001.py

      - name: Run test_find_and_click (GUARDED)
        continue-on-error: true
        run: |
          python -m unittest --verbose ./test/test_find_and_click.py

      - name: Run test_selenium (GUARDED)
        continue-on-error: true
        run: |
          python -m unittest --verbose ./test/test_selenium.py

      - name: Run test_urlparse
        run: |
          python -m unittest --verbose ./test/test_urlparse.py

      - name: Run test_workflow_find_and_click (GUARDED)
        continue-on-error: true
        run: |
          python -m unittest --verbose ./test/test_workflow_find_and_click.py

  pylint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-ui.txt.py3'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ui.txt.py3
          pip install pylint

      - name: Run pylint
        run: |
          pylint --rcfile=pylintrc --fail-under 5.0 *.py components/*.py test/*.py
