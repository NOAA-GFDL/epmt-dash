name: Run Unit Tests

on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-20.04

    env:
      EPMT_GUI_MOCK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.7'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ui.txt.py3

      - name: Run unit tests
        run: |
          python -m unittest test/test_urlparse.py
