name: Run Unit Tests

on:
  push:
    branches:
      - '**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    env:
      EPMT_GUI_MOCK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-ui.txt.py3'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ui.txt.py3

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest -x -vv test/test_urlparse.py
